spring:
  # Opcional: application-local.properties en la raíz del proyecto (no se sube a Git).
  # Ver application-local.properties.example.
  config:
    import: optional:file:./application-local.properties
  # Credenciales de Oracle solo por variables de entorno (o application-local.properties).
  # En IntelliJ: Run > Edit Configurations > Environment variables.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Swagger lee la cookie XSRF-TOKEN y la envia en X-XSRF-TOKEN (necesario para POST/PUT/PATCH)
    csrf:
      enabled: true

  api-docs:
    enabled: true

# Desarrollo: trazas detalladas de los servicios (parametros, filas y duracion de cada consulta)
logging:
  level:
    com.example.TrujillanosSAC: debug
