<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar cotizacion</title>
    <link rel="stylesheet" href="/css/admin-inventario.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/js/proveedor-compras.js" defer></script>
</head>
<body>

<aside class="inventory-sidebar provider-sidebar">
    <div class="inventory-brand">
        <strong>El Trujillano</strong>
        <span>Portal de proveedor</span>
    </div>
    <nav class="inventory-nav" aria-label="Portal proveedor">
        <a href="/proveedor/solicitudes">
            <i class="fa-solid fa-clipboard-list"></i>
            Solicitudes
        </a>
        <a class="is-active" href="/proveedor/cotizaciones">
            <i class="fa-solid fa-file-invoice-dollar"></i>
            Cotizaciones
        </a>
    </nav>
    <div class="inventory-sidebar-user">
        <span class="user-avatar" th:text="${#strings.substring(usuarioNombre, 0, 1)}">P</span>
        <span th:text="${usuarioNombre}">Proveedor</span>
    </div>
</aside>

<header class="inventory-topbar">
    <form th:action="@{/logout}" method="post">
        <button class="inventory-icon" type="submit" aria-label="Cerrar sesion">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </form>
</header>

<main class="inventory-page">
    <section class="inventory-header">
        <div>
            <h1>Enviar Cotizacion</h1>
            <p th:text="'Cotizacion para ' + ${solicitud.codigo()}">Cotizacion para OR_01</p>
        </div>
    </section>

    <p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form class="provider-quote-form"
          th:action="@{/proveedor/solicitudes/{id}/cotizar(id=${solicitud.idSolicitud()})}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <section class="inventory-panel is-active">
            <div class="provider-section-title">Insumos solicitados</div>
            <div class="inventory-table-wrap">
                <table class="inventory-table provider-table">
                    <thead>
                    <tr>
                        <th>Descripcion</th>
                        <th>Cant.</th>
                        <th>UM</th>
                        <th>Unitario</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="detalle : ${solicitud.detalles()}">
                        <td th:text="${detalle.insumo()}"></td>
                        <td th:text="${#numbers.formatDecimal(detalle.cantidad(), 1, 2)}"
                            th:data-quote-qty="${detalle.cantidad()}"></td>
                        <td th:text="${detalle.unidad()}"></td>
                        <td>
                            <label class="money-input">
                                <span>S/</span>
                                <input type="number" min="0.01" step="0.01" required
                                       th:name="${'precio_' + detalle.idDetalle()}"
                                       data-quote-price>
                            </label>
                        </td>
                        <td><strong data-quote-subtotal>S/ 0.00</strong></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="quote-total">
                <span>Total cotizado</span>
                <strong data-quote-total>S/ 0.00</strong>
            </div>
        </section>

        <section class="purchase-request-card provider-form-card">
            <div class="modal-form-grid">
                <label>
                    Fecha de entrega
                    <input type="date" name="fechaEntrega" required>
                </label>
            </div>
        </section>

        <div class="provider-page-actions">
            <a class="secondary-action" href="/proveedor/solicitudes">Cancelar</a>
            <button class="primary-action" type="submit">
                <i class="fa-regular fa-paper-plane"></i>
                Enviar cotizacion
            </button>
        </div>
    </form>
</main>

</body>
</html>
