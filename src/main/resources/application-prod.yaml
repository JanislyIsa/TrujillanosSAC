spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
  level:
    # Produccion: solo hitos (info) de los modulos; nada de debug
    com.example.TrujillanosSAC: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
  file:
    name: logs/trujillanos-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
