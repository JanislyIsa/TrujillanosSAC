spring.config.import=optional:file:./application-local.properties
spring.application.name=TrujillanosSAC
server.port=9191

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
spring.datasource.username=${DB_USERNAME:eltrujillano}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn

spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

inventario.monitor.habilitado=true
inventario.monitor.intervalo-ms=60000
inventario.monitor.inicio-ms=60000
inventario.cors.origenes=${INVENTARIO_CORS_ORIGENES:http://localhost:5173,http://localhost:3000}
app.seed.habilitado=${APP_SEED_HABILITADO:false}
